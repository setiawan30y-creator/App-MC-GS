google.script.run

```
.withSuccessHandler(function(result) {

/**

* Tampilkan aplikasi setelah login
  */
  function showApplication(user) {

document.getElementById(
'loginScreen'
).style.display = 'none';

document.getElementById(
'appShell'
).style.display = 'flex';

// Update nama user
const userName =
document.querySelector(
'.user-info strong'
);

const userRole =
document.querySelector(
'.user-info small'
);

const avatar =
document.querySelector(
'.user-avatar'
);

if (userName) {
userName.textContent =
user.nama || user.username;
}

if (userRole) {
userRole.textContent =
user.idRole || '';
}

if (avatar) {
avatar.textContent =
(
user.nama ||
user.username ||
'A'
)
.charAt(0)
.toUpperCase();
}

}

/**

* Cek session browser
  */
  function checkLoginSession() {

const saved =
sessionStorage.getItem(
'mcAlmaraUser'
);

if (!saved) {
return;
}

try {

```
const user =
  JSON.parse(saved);

showApplication(user);
```

} catch (error) {

```
sessionStorage.removeItem(

```

}

}


/**
 * Navigasi halaman
 */
function showPage(page, button) {

  document
    .querySelectorAll('.page')
    .forEach(function(el) {
      el.classList.remove('active');
    });


  const target = document.getElementById(
    'page-' + page
  );

  if (target) {
    target.classList.add('active');
  }


  document
    .querySelectorAll('.nav-item')
    .forEach(function(el) {
      el.classList.remove('active');
    });


  if (button) {
    button.classList.add('active');
  }


  const title =
    PAGE_NAMES[page] || 'Dashboard';


  document.getElementById(
    'pageTitle'
  ).textContent = title;


  document.getElementById(
    'breadcrumbPage'
  ).textContent = title;


  closeSidebar();
}


/**
 * Sidebar mobile
 */
function toggleSidebar() {

  const sidebar =
    document.getElementById('sidebar');

  sidebar.classList.toggle('open');

}


/**
 * Tutup sidebar
 */
function closeSidebar() {

  const sidebar =
    document.getElementById('sidebar');

  sidebar.classList.remove('open');

}


/**
 * Load informasi aplikasi dari Apps Script
 */
function loadAppData() {

  google.script.run
    .withSuccessHandler(function(data) {

      console.log(
        'MC-App-Almara:',
        data
      );

    })
    .withFailureHandler(function(error) {

      console.error(
        'Gagal mengambil data aplikasi:',
        error
      );

    })
    .getWebAppData();

}
